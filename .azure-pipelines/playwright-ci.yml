trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

stages:
  - stage: ArchitectureGate
    displayName: 'SOLID Architecture & Session Tape Gate'
    jobs:
      - job: Audit
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: npm ci
            displayName: 'Install dependencies'
          - script: npm run typecheck && npm run audit:solid && npm run validate:tapes
            displayName: 'Run TypeScript, SOLID Audit & Tape Validator'

  - stage: PlaywrightShardedE2E
    displayName: 'Parallel Sharded Playwright Execution'
    dependsOn: ArchitectureGate
    jobs:
      - job: E2E
        strategy:
          parallel: 2
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: npm ci
            displayName: 'Install dependencies'
          - script: npx playwright install --with-deps chromium
            displayName: 'Install Playwright Chromium'
          - script: npx playwright test --project=chromium --shard=$(System.JobPositionInPhase)/$(System.TotalJobsInPhase)
            displayName: 'Execute Playwright Shard'
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/junit.xml'
