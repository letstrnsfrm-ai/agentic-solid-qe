name: Automated GitHub Release Notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Validate & Generate Release Notes (Read-Only)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.notes.outputs.should_release }}
      next_tag: ${{ steps.notes.outputs.next_tag }}
      release_title: ${{ steps.notes.outputs.release_title }}
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Fast Quality, Security, Architecture & Engine Gate
        run: |
          npm audit --audit-level=high
          npm run typecheck
          npm run audit:solid
          npm run validate:tapes
          npm run test:engine

      - name: Generate SemVer Tag & Release Notes
        id: notes
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          node scripts/generate-release-notes.mjs \
            --output release-notes-artifact.md \
            --json-meta .release-meta.json \
            --require-manifest-sync

      - name: Upload Release Notes Artifact
        if: steps.notes.outputs.should_release == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-notes-bundle
          path: release-notes-artifact.md
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release & Tag
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download Sanitized Release Notes
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-notes-bundle
          path: release-bundle

      - name: Publish GitHub Release via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          NEXT_TAG: ${{ needs.prepare-release.outputs.next_tag }}
          RELEASE_TITLE: ${{ needs.prepare-release.outputs.release_title }}
        run: |
          if [[ ! "$NEXT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Security Error: Unsafe NEXT_TAG format: $NEXT_TAG"
            exit 1
          fi
          if [ -L "release-bundle/release-notes-artifact.md" ] || [ ! -f "release-bundle/release-notes-artifact.md" ]; then
            echo "❌ Security Error: Missing or symlinked release notes artifact."
            exit 1
          fi
          gh release create \
            --repo "$REPO_SLUG" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "release-bundle/release-notes-artifact.md" \
            --latest \
            -- "$NEXT_TAG"
