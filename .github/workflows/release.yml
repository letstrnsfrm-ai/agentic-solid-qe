name: Automated GitHub Release Notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Validate & Publish Release Notes
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Fast Quality, Security & Architecture Gate
        run: |
          npm audit --audit-level=high
          npm run typecheck
          npm run audit:solid
          npm run validate:tapes

      - name: Generate SemVer Tag & Release Notes
        id: notes
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          node scripts/generate-release-notes.mjs \
            --output .release-notes.md \
            --json-meta .release-meta.json \
            --sync-manifests

      - name: Commit & Push Synced Release Manifests
        id: sync
        if: steps.notes.outputs.should_release == 'true'
        env:
          NEXT_TAG: ${{ steps.notes.outputs.next_tag }}
        run: |
          if [[ ! "$NEXT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Security Error: Unsafe NEXT_TAG format: $NEXT_TAG"
            exit 1
          fi
          TARGET_SHA="${{ github.sha }}"
          if ! git diff --quiet -- package.json package-lock.json CHANGELOG.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json CHANGELOG.json
            git commit -m "chore(release): sync manifests for ${NEXT_TAG} [skip ci]"
            git push origin HEAD:main
            TARGET_SHA="$(git rev-parse HEAD)"
          fi
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release & Tag
        if: steps.notes.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.notes.outputs.next_tag }}
          RELEASE_TITLE: ${{ steps.notes.outputs.release_title }}
          TARGET_SHA: ${{ steps.sync.outputs.target_sha }}
        run: |
          if [[ ! "$NEXT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Security Error: Unsafe NEXT_TAG format: $NEXT_TAG"
            exit 1
          fi
          gh release create \
            --target "${TARGET_SHA:-${{ github.sha }}}" \
            --title "$RELEASE_TITLE" \
            --notes-file .release-notes.md \
            --latest \
            -- "$NEXT_TAG"
