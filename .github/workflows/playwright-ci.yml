name: Agentic-SOLID-QE Playwright CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      grep_tags:
        description: 'Optional Playwright @tag regex filter (e.g. @p0, @motor-b2c, @api-contract)'
        required: false
        default: ''
        type: string
      target_url:
        description: 'Optional BASE_URL override for staging/UAT environment'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  architecture-gate:
    name: Typecheck, SOLID Audit & Session Tape Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run audit:solid
      - run: npm run validate:tapes
      - run: npm run test:engine

  playwright-smoke:
    name: Playwright PR Smoke Gate (@smoke | @p0)
    if: github.event_name == 'pull_request'
    needs: architecture-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run Smoke / P0 Suite
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test --project=chromium --grep "@smoke|@p0" --pass-with-no-tests
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: failure()
        with:
          name: playwright-report-smoke
          path: playwright-report/
          include-hidden-files: false
          retention-days: 7

  playwright-e2e:
    name: Playwright E2E (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    if: github.event_name != 'pull_request'
    needs: architecture-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Validate Dispatch Inputs & Target Origin Policy
        env:
          INPUT_TARGET_URL: ${{ inputs.target_url }}
          CONFIGURED_BASE_URL: ${{ vars.BASE_URL }}
          ALLOWED_TARGET_HOSTS: ${{ vars.ALLOWED_TARGET_HOSTS }}
          GREP_TAGS: ${{ inputs.grep_tags }}
        run: |
          node -e '
            const grepTags = process.env.GREP_TAGS || "";
            if (grepTags && !/^@[a-zA-Z0-9_|@-]+$/.test(grepTags)) {
              console.error("❌ Invalid grep_tags input. Must be a safe @tag expression.");
              process.exit(1);
            }
            const targetUrl = process.env.INPUT_TARGET_URL || "";
            if (targetUrl) {
              let parsed;
              try {
                parsed = new URL(targetUrl);
              } catch {
                console.error("❌ Invalid target_url URL format.");
                process.exit(1);
              }
              const host = parsed.hostname.toLowerCase();
              const isLocal = host === "localhost" || host === "127.0.0.1";
              if (parsed.protocol !== "https:" && !(parsed.protocol === "http:" && isLocal)) {
                console.error("❌ Security Error: target_url must use https:// for non-localhost environments.");
                process.exit(1);
              }
              if (parsed.username || parsed.password || /^169\.254\.|^100\.100\.100\.200$|^metadata/i.test(host)) {
                console.error("❌ Security Error: target_url contains forbidden metadata host or embedded credentials.");
                process.exit(1);
              }
              const allowed = new Set(
                (process.env.ALLOWED_TARGET_HOSTS || "")
                  .split(",")
                  .map((s) => s.trim().toLowerCase())
                  .filter(Boolean)
              );
              if (process.env.CONFIGURED_BASE_URL) {
                try {
                  allowed.add(new URL(process.env.CONFIGURED_BASE_URL).hostname.toLowerCase());
                } catch {}
              }
              if (allowed.size > 0 && !allowed.has(host)) {
                console.error(`❌ Security Error: target_url host "${host}" is not in ALLOWED_TARGET_HOSTS or BASE_URL.`);
                process.exit(1);
              }
            }
          '
      - name: Run Sharded Playwright Suite
        env:
          BASE_URL: ${{ inputs.target_url || vars.BASE_URL }}
          GREP_TAGS: ${{ inputs.grep_tags }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          if [ -n "$GREP_TAGS" ]; then
            npx playwright test --project=chromium --grep "$GREP_TAGS" --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --pass-with-no-tests
          else
            npx playwright test --project=chromium --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --pass-with-no-tests
          fi
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: failure()
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: playwright-report/
          include-hidden-files: false
          retention-days: 7
