name: Agentic-SOLID-QE Playwright CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      grep_tags:
        description: 'Optional Playwright @tag regex filter (e.g. @p0, @motor-b2c, @api-contract)'
        required: false
        default: ''
        type: string
      target_url:
        description: 'Optional BASE_URL override for staging/UAT environment'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  architecture-gate:
    name: Typecheck, SOLID Audit & Session Tape Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run audit:solid
      - run: npm run validate:tapes
      - run: npm run test:engine

  playwright-smoke:
    name: Playwright PR Smoke Gate (@smoke | @p0)
    if: github.event_name == 'pull_request'
    needs: architecture-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Run Affected Smoke / P0 Suite
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          if [[ ! "$GITHUB_BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "❌ Security Error: Unsafe GITHUB_BASE_REF format."
            exit 1
          fi
          npx --no-install playwright test --project=chromium --only-changed="origin/$GITHUB_BASE_REF" --grep "@smoke|@p0" --pass-with-no-tests
      - name: Refresh Stakeholder Coverage Map
        if: always()
        run: npm run map
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: stakeholder-coverage-map-pr
          path: reports/system-map.html
          include-hidden-files: false
          retention-days: 14
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: failure()
        with:
          name: playwright-report-smoke
          path: playwright-report/
          include-hidden-files: false
          retention-days: 3

  playwright-e2e:
    name: Playwright E2E (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    if: github.event_name != 'pull_request'
    needs: architecture-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Validate Dispatch Inputs & Target Origin Policy
        env:
          INPUT_TARGET_URL: ${{ inputs.target_url }}
          CONFIGURED_BASE_URL: ${{ vars.BASE_URL }}
          ALLOWED_TARGET_HOSTS: ${{ vars.ALLOWED_TARGET_HOSTS }}
          GREP_TAGS: ${{ inputs.grep_tags }}
        run: |
          node -e '
            const grepTags = process.env.GREP_TAGS || "";
            if (grepTags && !/^@[a-zA-Z0-9_|@-]+$/.test(grepTags)) {
              console.error("❌ Invalid grep_tags input. Must be a safe @tag expression.");
              process.exit(1);
            }
            const targetUrl = (process.env.INPUT_TARGET_URL || "").trim();
            if (targetUrl) {
              if (/[\x00-\x1f\x7f\\]/.test(targetUrl) || /^https?:\/(?!\/)/i.test(targetUrl)) {
                console.error("❌ Security Error: Malformed target_url.");
                process.exit(1);
              }
              let parsed;
              try {
                parsed = new URL(targetUrl);
              } catch {
                console.error("❌ Invalid target_url URL format.");
                process.exit(1);
              }
              const host = parsed.hostname.toLowerCase().replace(/\.+$/, "");
              const bare = host.replace(/^\[|\]$/g, "");
              if (parsed.protocol !== "https:") {
                console.error("❌ Security Error: target_url in CI must use https://.");
                process.exit(1);
              }
              if (
                parsed.username ||
                parsed.password ||
                bare === "localhost" ||
                bare.endsWith(".localhost") ||
                bare === "::" ||
                bare === "::1" ||
                /^127\.|^169\.254\.|^10\.|^192\.168\.|^172\.(?:1[6-9]|2\d|3[01])\.|^100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.|^0\.|^192\.0\.0\.|^198\.1[89]\.|^(?:22[4-9]|2[34]\d|25[0-5])\./i.test(bare) ||
                /^(?:0*:)*ffff:|^64:ff9b:|^2002:|^2001:0*:|^2001:db8:|^100::|^fec0:|^fe[89ab][0-9a-f]:|^f[cd][0-9a-f]{2}:|^ff[0-9a-f]{2}:|^::[0-9a-f]{1,4}(?::[0-9a-f]{1,4})?$|^metadata|^instance-data$/i.test(bare)
              ) {
                console.error("❌ Security Error: target_url contains forbidden loopback/private/metadata host or embedded credentials.");
                process.exit(1);
              }
              const allowed = new Set(
                (process.env.ALLOWED_TARGET_HOSTS || "")
                  .split(",")
                  .map((s) => s.trim().toLowerCase().replace(/\.+$/, ""))
                  .filter(Boolean)
              );
              if (process.env.CONFIGURED_BASE_URL) {
                try {
                  allowed.add(new URL(process.env.CONFIGURED_BASE_URL).hostname.toLowerCase().replace(/\.+$/, ""));
                } catch {}
              }
              if (allowed.size === 0 || !allowed.has(host)) {
                console.error(`❌ Security Error: target_url host "${host}" is not explicitly permitted by ALLOWED_TARGET_HOSTS or BASE_URL.`);
                process.exit(1);
              }
            }
          '
      - name: Run Sharded Playwright Suite
        env:
          BASE_URL: ${{ inputs.target_url || vars.BASE_URL }}
          GREP_TAGS: ${{ inputs.grep_tags }}
          PW_BLOB_REPORT: '1'
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          if [ -n "$GREP_TAGS" ]; then
            npx --no-install playwright test --project=chromium --grep "$GREP_TAGS" --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --pass-with-no-tests
          else
            npx --no-install playwright test --project=chromium --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --pass-with-no-tests
          fi
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          include-hidden-files: false
          retention-days: 3

  merge-reports:
    name: Merge Sharded HTML & Stakeholder Coverage Reports
    if: always() && github.event_name != 'pull_request'
    needs: playwright-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Verify Downloaded Blob Report Archive Integrity
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const dir = path.resolve("all-blob-reports");
            if (!fs.existsSync(dir)) process.exit(0);
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              const st = fs.lstatSync(full);
              if (st.isSymbolicLink() || !st.isFile() || !entry.name.endsWith(".zip") || entry.name.includes("..")) {
                console.error(`❌ Security Error: Unexpected or symlinked blob artifact entry: ${entry.name}`);
                process.exit(1);
              }
            }
          '
      - run: npx --no-install playwright merge-reports --reporter=html --reporter=./scripts/system-map-reporter.mjs ./all-blob-reports
      - run: npm run map
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-report-merged
          path: playwright-report/
          include-hidden-files: false
          retention-days: 3
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: stakeholder-coverage-map
          path: reports/system-map.html
          include-hidden-files: false
          retention-days: 14
      - name: Stage Stakeholder Map for GitHub Pages
        if: vars.PUBLISH_STAKEHOLDER_PAGES == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          mkdir -p pages-dist
          cp reports/system-map.html pages-dist/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: vars.PUBLISH_STAKEHOLDER_PAGES == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          path: pages-dist/

  publish-stakeholder-pages:
    name: Publish Live Stakeholder Coverage Map (GitHub Pages)
    if: always() && vars.PUBLISH_STAKEHOLDER_PAGES == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: merge-reports
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

